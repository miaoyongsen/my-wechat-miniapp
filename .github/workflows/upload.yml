name: Upload WeChat Mini Program
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'app.json'
      - 'app.wxss'
      - 'pages/**'
      - 'project.config.json'
      - '.github/workflows/upload.yml'
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install miniprogram-ci
        run: npm install --no-save miniprogram-ci
      - name: Upload development version
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$PRIVATE_KEY_BASE64" ]; then
            echo "Missing GitHub secret WECHAT_PRIVATE_KEY_BASE64"
            exit 1
          fi
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > /tmp/wechat-upload.key
          chmod 600 /tmp/wechat-upload.key
          node - <<'NODE'
          const ci = require('miniprogram-ci');
          (async () => {
            const project = new ci.Project({
              appid: 'wxaa56652fd97af059',
              type: 'miniProgram',
              projectPath: process.cwd(),
              privateKeyPath: '/tmp/wechat-upload.key',
              ignores: ['node_modules/**/*', '.git/**/*', '.github/**/*', 'cloudfunctions/**/*']
            });
            await ci.upload({
              project,
              version: '0.1.' + process.env.GITHUB_RUN_NUMBER,
              desc: 'GitHub Actions 自动上传',
              setting: { es6: true, minify: true },
              onProgressUpdate: console.log
            });
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          rm -f /tmp/wechat-upload.key
